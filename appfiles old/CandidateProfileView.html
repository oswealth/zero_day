<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Profile View</title>
  <link rel="stylesheet" href="CandidateProfileView.css">
</head>
<body>
  <div id="candidate-profile-view">
    <h1 id="welcome-message"></h1>
    <div class="profile-section">
      <h2>Profile Overview</h2>
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Country:</strong> <span id="country"></span></p>
      <p><strong>Phone Number:</strong> <span id="phone-number"></span></p>
      <div>
        <strong>Languages:</strong>
        <ul id="languages-list"></ul>
      </div>
      <p><strong>Professional Background:</strong> <span id="professional-background"></span></p>
      <p><strong>Years of Experience:</strong> <span id="years-of-experience"></span></p>
      <div>
        <strong>Skills:</strong>
        <ul id="skills-list"></ul>
      </div>
      <p><strong>Employment Status:</strong> <span id="employment-status"></span></p>
      <p><strong>Summary:</strong> <span id="summary"></span></p>
    </div>
    <script src="CandidateProfileView.js"></script>
  </div>
</body>
</html>
